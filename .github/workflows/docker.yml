name: Docker build & publish

# Builds the production image in CI and pushes it to GHCR. The VPS only ever pulls what this
# workflow publishes — it never builds. See docs/deployment/docker-vps.md.
#
# Application config comes from Doppler (project `culprit`, config `stg`), fetched per job with a
# read-only service token — see ADR-013. GitHub holds only what CI needs to reach the box:
#
# Required repo configuration (Settings > Secrets and variables > Actions):
#   Secrets:   DOPPLER_TOKEN (read-only Doppler service token for culprit/stg — the only
#              application credential stored here; everything else is fetched with it)
#              DEPLOY_SSH_KEY (private key for the `deploy` user on the target VPS)
#   Variables: DEPLOY_HOST, DEPLOY_USER (VPS SSH target)
#
# The SSH triple deliberately stays in GitHub: it is how the pipeline reaches the VPS, not
# configuration the application reads, and a multi-line private key is exactly the value log
# masking handles least well.
#
# Fetched from Doppler at run time:
#   DATABASE_URL, DIRECT_URL, BETTER_AUTH_SECRET — needed at build time only because Next
#     statically traces route handlers that import the Zod-validated server env module; same
#     values the container uses at runtime (docs/deployment/docker-vps.md).
#   NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_CALENDLY_URL, NEXT_PUBLIC_TURNSTILE_SITE_KEY — public by
#     design, inlined into the client bundle.
#   R2_PUBLIC_URL — not a NEXT_PUBLIC_* var and not secret, but required at build time:
#     next.config.ts's images.remotePatterns is computed from it and baked into the standalone
#     output, so setting it only at runtime has no effect (see Dockerfile).
#
# secrets-fetch-action masks every fetched value in the log automatically, so the public ones
# above appear masked too. That is the action's behaviour, not a claim that they are secret.
#
# The VPS is shared with other apps behind a single Caddy reverse proxy — see
# docs/deployment/docker-vps.md for the ~/server/apps/<app>/ layout this job assumes already
# exists (bootstrapped once by hand: directory, .env.production, Caddy site block).#
# Repository guard: every job below is gated on `github.repository`. The code is mirrored to a
# second remote, culpritteam/web, which exists only to give Vercel something to deploy from.
# Vercel builds through its own GitHub integration and needs no workflow, so nothing in .github/
# should run there — without the guard, the mirror would try to publish images, SSH to the VPS and
# apply migrations with secrets it does not have, and fail on every push.
# See docs/deployment/deployment.md#two-remotes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Bypass the Docker build cache (needed after a content-only DB change with no source diff — the cached `next build` layer would otherwise reuse the old prerendered ISR pages)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false # never cancel a build that might already be mid-push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint, typecheck, unit test
    if: github.repository == 'Wyco68/CulpritWeb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Fetch config from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      # No postinstall hook generates the Prisma client — lint/typecheck/test all import types
      # from it, so a fresh checkout fails without this (caught the hard way: passed locally only
      # because a stale generated client already existed on disk from earlier `npm run build`).
      # `prisma.config.ts` calls env('DIRECT_URL') at config-load time — required even for
      # `generate`, which otherwise makes no DB connection at all.
      - run: npm run db:generate
        env:
          DIRECT_URL: ${{ steps.doppler.outputs.DIRECT_URL }}

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  migrate:
    name: Apply database migrations
    if: github.repository == 'Wyco68/CulpritWeb'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Fetch config from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      # Release-step migration, per docs/deployment/deployment.md: `predev` only runs before
      # `next dev`, never before a build, so CI must run `migrate deploy` explicitly. Runs against
      # DIRECT_URL (unpooled) — Supabase's pooled DATABASE_URL is pgbouncer transaction mode,
      # which can't run migrations.
      - run: npm run db:deploy
        env:
          DIRECT_URL: ${{ steps.doppler.outputs.DIRECT_URL }}

  build-and-push:
    name: Build & push image
    if: github.repository == 'Wyco68/CulpritWeb'
    needs: [test, migrate]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.sha.outputs.value }}
      image-repo: ${{ steps.repo.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short-SHA tag
        id: sha
        # docker/metadata-action's `version` output picks between the sha/latest tag rules by an
        # internal priority that resolved to "latest" here, not the immutable tag deploy.sh
        # expects — compute it directly instead of trusting that output for this purpose.
        run: echo "value=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image repo
        id: repo
        # GHCR requires a lowercase path; github.repository preserves the repo's actual case
        # (Wyco68/CulpritWeb), which docker/metadata-action already lowercases for the pushed
        # tags — this mirrors that so the deploy job pulls the same ref that was actually pushed.
        run: echo "value=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Fetched as step outputs rather than injected as env vars: build-args and BuildKit secrets
      # below are YAML expressions, which a `doppler run` wrapper could not reach.
      - name: Fetch config from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build-time secrets are mounted read-only for a single RUN layer in the Dockerfile and are
      # never written into an image layer, env, or label — they cannot be recovered with
      # `docker history` the way a plain ARG/ENV secret could.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha' }}
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ steps.doppler.outputs.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CALENDLY_URL=${{ steps.doppler.outputs.NEXT_PUBLIC_CALENDLY_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.doppler.outputs.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            R2_PUBLIC_URL=${{ steps.doppler.outputs.R2_PUBLIC_URL }}
          secrets: |
            database_url=${{ steps.doppler.outputs.DATABASE_URL }}
            direct_url=${{ steps.doppler.outputs.DIRECT_URL }}
            better_auth_secret=${{ steps.doppler.outputs.BETTER_AUTH_SECRET }}

  deploy:
    name: Deploy to VPS
    if: github.repository == 'Wyco68/CulpritWeb'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Sync only the non-secret deploy files — .env.production stays untouched on the VPS
      # (bootstrapped once by hand; CI never regenerates or overwrites runtime secrets there).
      - name: Sync compose file and deploy script
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            docker-compose.production.yml scripts/deploy.sh \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:~/server/apps/culprit-web/"

      # GHCR packages default to private, and the VPS has no standing registry credential — log
      # in with this job's short-lived GITHUB_TOKEN (scoped to this run, expires shortly after)
      # rather than provisioning a long-lived PAT on the box.
      - name: Log the VPS into GHCR
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Run deploy.sh on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ~/server/apps/culprit-web && chmod +x deploy.sh && IMAGE_REPO=${{ needs.build-and-push.outputs.image-repo }} ./deploy.sh ${{ needs.build-and-push.outputs.image-tag }}"
