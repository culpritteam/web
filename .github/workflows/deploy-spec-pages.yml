name: Deploy Docs to GitHub Pages

# Publishes the client-facing docs as the GitHub Pages site. All source files live together under
# docs-site/ (see docs-site/README.md if that's ever added — for now, this mapping is the map):
#   docs-site/PROJECT_SPEC.html          -> index.html
#   docs-site/DEVELOPMENT_PROGRESS.html  -> progress.html
#   docs-site/FRONTEND.html              -> frontend.html
#   docs-site/BACKEND.html               -> backend.html
#   docs-site/ARCHITECTURE.html          -> architecture.html
#   docs-site/DEPLOYMENT.html            -> deployment.html
#   docs-site/CICD_SECRETS.html          -> cicd-secrets.html
#   docs-site/HOSTING_COST.html          -> hosting-cost.html   (+ hosting-cost-assets/)
#   docs-site/style.css                  -> style.css   (shared stylesheet all pages link to)
# Fully independent from the Vercel application deploy — different target, different domain.
# This workflow touches nothing else in the repo.
#
# Gated on `github.repository`: the culpritteam/web mirror exists only for Vercel and has no
# Pages site to publish to. See docs/deployment/deployment.md#two-remotes.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-spec-pages.yml'
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Wyco68/CulpritWeb'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          if [ ! -f docs-site/PROJECT_SPEC.html ]; then
            echo "docs-site/PROJECT_SPEC.html not found — nothing to publish." >&2
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          cp docs-site/PROJECT_SPEC.html _site/index.html
          for pair in "DEVELOPMENT_PROGRESS.html:progress.html" "FRONTEND.html:frontend.html" "BACKEND.html:backend.html" "ARCHITECTURE.html:architecture.html" "DEPLOYMENT.html:deployment.html" "CICD_SECRETS.html:cicd-secrets.html" "HOSTING_COST.html:hosting-cost.html"; do
            src="${pair%%:*}"
            dest="${pair##*:}"
            if [ -f "docs-site/$src" ]; then
              cp "docs-site/$src" "_site/$dest"
            fi
          done
          # Screenshots referenced by hosting-cost.html. Images only, nothing else.
          if [ -d docs-site/hosting-cost-assets ]; then
            mkdir -p _site/hosting-cost-assets
            cp docs-site/hosting-cost-assets/*.png _site/hosting-cost-assets/
          fi
          # Shared stylesheet — all 6 pages link to this instead of each embedding its own copy.
          cp docs-site/style.css _site/style.css
          # Do NOT copy any other file. The Pages site is these docs only.

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
